name: Bug report
description: Something is broken or a number looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not paste wallet addresses, RPC URLs, API keys or the contents of your `.env`.**
        Redact them (for example `0x1234...abcd`) or reproduce with a public address.
        Security problems go to a private advisory instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an address with an Aave position on Arbitrum
        2. Open the address page
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Balances / snapshots
        - History / backfill
        - PnL / ROI
        - Risk (health factor, liquidation, APY)
        - Activity ledger
        - UI / formatting / stealth mode
        - Setup / Docker / self-hosting
        - Other
    validations:
      required: true
  - type: dropdown
    id: chain
    attributes:
      label: Chain
      options:
        - Ethereum
        - Arbitrum
        - Both
        - Not chain specific
  - type: dropdown
    id: install
    attributes:
      label: How do you run ledgerline?
      options:
        - Docker Compose
        - Plain Node (npm run start + worker)
        - Development (npm run dev)
        - Other
    validations:
      required: true
  - type: dropdown
    id: rpc
    attributes:
      label: RPC setup
      options:
        - Alchemy (Ethereum and Arbitrum enabled)
        - Alchemy (only some networks enabled)
        - Other provider
        - No key (public endpoints only)
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "git rev-parse --short HEAD"
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: "Ubuntu 24.04, Node 22.x"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Worker or web logs around the problem. Remove addresses and URLs with keys first.
      render: shell
